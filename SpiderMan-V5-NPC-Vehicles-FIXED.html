<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yashraj Spider-Man: Avengers Assemble</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#8fc1ea; --card:rgba(255,255,255,.96); --ink:#141a28; --muted:#4b566b; --accent:#d61f3f; --hud:rgba(12,18,32,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0b1220;--card:rgba(16,24,42,.96);--ink:#f1f5ff;--muted:#a9b4cc;}
}
:root[data-theme="dark"]{--bg:#0b1220;--card:rgba(16,24,42,.96);--ink:#f1f5ff;--muted:#a9b4cc;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}

.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 0 calc(12px + env(safe-area-inset-left,0px));
  pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.75)}
.bar{width:150px;height:12px;border-radius:8px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.85);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ef4444,#f97316)}
.bar.boss{width:190px}
.bar.boss i{background:linear-gradient(90deg,#a855f7,#ec4899)}
#stg{margin-top:5px;font-size:12px;font-weight:700;opacity:.9}
#obj{margin-top:2px;font-weight:800;font-size:15px;line-height:1.25;max-width:60vw}
#bossw{margin-top:7px;display:none}
#bossn{font-weight:800;font-size:13px;margin-bottom:2px}
.hudR{display:flex;flex-direction:column;align-items:center;min-width:54px}

#dist{font-size:12px;font-weight:700;margin-top:2px;min-height:14px}
#pause{pointer-events:auto;margin-top:6px;width:40px;height:34px;border-radius:10px;border:2px solid rgba(255,255,255,.8);background:var(--hud);color:#fff;font-weight:800;font-size:14px;font-family:inherit;touch-action:manipulation}

#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);max-width:86vw;text-align:center;font-weight:800;font-size:16px;line-height:1.3;
  padding:8px 14px;border-radius:12px;background:var(--hud);opacity:0;transition:opacity .25s;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#toast.show{opacity:1}
#banner{position:fixed;left:0;right:0;top:38%;text-align:center;pointer-events:none;opacity:0;transition:opacity .35s;padding:0 12px}
#banner.show{opacity:1}
#banner b{display:block;font-family:"Arial Black",Impact,system-ui,sans-serif;font-size:32px;line-height:1.05;color:#ffe14a;
  -webkit-text-stroke:1.5px #000;paint-order:stroke fill;text-shadow:0 3px 0 #b3141f,0 6px 12px rgba(0,0,0,.6);letter-spacing:.5px}
#banner span{display:block;margin-top:6px;font-size:14px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9)}
#hurt{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(ellipse at center,rgba(255,0,0,0) 45%,rgba(220,20,40,.55) 100%)}
#tint{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;opacity:0;transition:opacity .35s;background:rgba(70,255,150,.22)}
#flash{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;opacity:0;background:#fff}

#zone{position:fixed;left:0;bottom:0;width:48%;height:50%;touch-action:none}
#stick{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;
  background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.6);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.6)}
#btns{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:206px;height:190px}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid rgba(255,255,255,.85);
  background:var(--hud);color:#fff;font-weight:800;font-size:12px;letter-spacing:.4px;touch-action:none;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.btn.down{background:rgba(214,31,63,.9);transform:scale(.94)}
#bSwing{right:0;bottom:0;width:92px;height:92px;font-size:15px;background:rgba(214,31,63,.55)}
#bJump{right:104px;bottom:4px;width:64px;height:64px}
#bPunch{right:6px;bottom:104px;width:64px;height:64px}
#bWeb{right:92px;bottom:84px;width:64px;height:64px}

.card{background:var(--card);color:var(--ink);border-radius:18px;padding:20px 20px 18px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35);max-height:100%;overflow:auto;touch-action:pan-y}

.card ul{margin:8px 0 12px;padding-left:18px;font-size:13.5px;line-height:1.55;color:var(--ink)}

.card button.alt{background:transparent;color:var(--ink);border:2px solid var(--muted);font-size:15px;padding:10px}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.addEventListener('error',e=>{console.error('Uncaught error:',e.error?.message||e.message);},true);
window.addEventListener('unhandledrejection',e=>{console.error('Unhandled promise:',e.reason);});
if(!window.THREE){
  console.error('THREE.js failed to load from CDN, trying fallback...');
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/three@r128/build/three.min.js';

<script>
(function(){

if(typeof THREE==='undefined'){

const $=id=>document.getElementById(id);

// ========== YASHRAJ SPIDER-MAN ==========
const YASHRAJ={name:'Yashraj',title:'Spider-Man',origin:'Delhi, India',color:'#ff6b1a'};
Object.defineProperty(window,'heroName',{get:()=>YASHRAJ.name,configurable:true});

/* ---------- renderer (tuned for low-end phones) ---------- */
const canvas=$('c');
let renderer;
function initRenderer(){

  }catch(e){
    console.error('THREE.WebGLRenderer failed:',e.message);
    try{
      const ctx=canvas.getContext('webgl2',{antialias:false,alpha:false,precision:'mediump'})||canvas.getContext('webgl',{antialias:false,alpha:false,precision:'mediump'});
      if(!ctx)throw new Error('No WebGL context');
      renderer=new THREE.WebGLRenderer({canvas,context:ctx,antialias:false,alpha:false});
      return true;
    }catch(e2){
      console.error('WebGL fallback failed:',e2.message);
      return false;
    }
  }
}
if(!initRenderer()){
  $('ovT').textContent='WebGL Not Supported';
  $('ovP').innerHTML='<p>Your browser doesn\'t support WebGL, which is needed for this game.</p><p><b>Solutions:</b></p><ul><li>Try Chrome, Firefox, Edge, or Safari (latest versions)</li><li>Update your graphics drivers</li><li>Enable hardware acceleration in browser settings</li><li>On mobile, try a different browser app</li></ul>';
  $('ovB').style.display='none';
  return;
}
// Handle WebGL context loss (for background tabs, etc.)
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();console.warn('WebGL context lost');},false);
canvas.addEventListener('webglcontextrestored',()=>{console.warn('WebGL context restored');},false);
const maxRatio=Math.min(window.devicePixelRatio||1,1.5);
let ratio=Math.min(maxRatio,(navigator.deviceMemory&&navigator.deviceMemory<=4)?0.85:1);
let SKY=0x9cc9ee;
const scene=new THREE.Scene();
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,120,420);  // Slightly increased fog far plane for stability
const camera=new THREE.PerspectiveCamera(65,1,0.5,520);
const hemi=new THREE.HemisphereLight(0xdfeeff,0x556070,0.95);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2d8,0.8);sun.position.set(-60,100,40);scene.add(sun);
function resize(){
  renderer.setPixelRatio(ratio);
  renderer.setSize(window.innerWidth,window.innerHeight,false);
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));
resize();

/* ---------- storm state (for Venom finale) ---------- */
const storm={on:false,t:0};
let rainPts=null,rainGeo=null,rainVel=null;
function makeRain(){
  const N=260;const pos=new Float32Array(N*3);rainVel=new Float32Array(N);
  for(let i=0;i<N;i++){pos[i*3]=(Math.random()-0.5)*220;pos[i*3+1]=Math.random()*90;pos[i*3+2]=(Math.random()-0.5)*220;rainVel[i]=38+Math.random()*20;}
  rainGeo=new THREE.BufferGeometry();rainGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  rainPts=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0xbcd4ff,size:0.35,transparent:true,opacity:0.65}));
  rainPts.frustumCulled=false;rainPts.visible=false;scene.add(rainPts);
}
function updateRain(dt,px,pz){
  if(!rainPts)return;
  const pos=rainGeo.attributes.position.array;
  for(let i=0;i<pos.length/3;i++){
    pos[i*3+1]-=rainVel[i]*dt;
    if(pos[i*3+1]<-2){pos[i*3+1]=70+Math.random()*20;pos[i*3]=px+(Math.random()-0.5)*220;pos[i*3+2]=pz+(Math.random()-0.5)*220;}
  }
  rainGeo.attributes.position.needsUpdate=true;
}
function setStorm(on){
  storm.on=on;
  if(rainPts)rainPts.visible=on;
}

/* ---------- shared geometry / materials ---------- */
const BOX=new THREE.BoxGeometry(1,1,1);
const SPH=new THREE.SphereGeometry(0.5,8,6);
const matCache={};
const M=c=>matCache[c]||(matCache[c]=new THREE.MeshLambertMaterial({color:c}));

/* ---------- city: one merged mesh = one draw call ---------- */
const bP=[],bN=[],bUV=[],bC=[],bI=[];
function addBox(x0,y0,z0,x1,y1,z1,col,plain){
  const faces=[
    {n:[1,0,0],v:[[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1]],w:z1-z0,h:y1-y0},
    {n:[-1,0,0],v:[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],w:z1-z0,h:y1-y0},
    {n:[0,0,1],v:[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],w:x1-x0,h:y1-y0},
    {n:[0,0,-1],v:[[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0]],w:x1-x0,h:y1-y0},
    {n:[0,1,0],v:[[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0]],roof:true}
  ];
  for(const f of faces){
    const b=bP.length/3;
    for(let k=0;k<4;k++){
      bP.push(f.v[k][0],f.v[k][1],f.v[k][2]);
      bN.push(f.n[0],f.n[1],f.n[2]);
      bC.push(col.r,col.g,col.b);
    }
    if(f.roof||plain){bUV.push(0.02,0.02,0.02,0.02,0.02,0.02,0.02,0.02);}
    else{const u=f.w/8,v=f.h/8;bUV.push(0,0,u,0,u,v,0,v);}
    bI.push(b,b+1,b+2,b,b+2,b+3);
  }
}
const cols=[];const grid=new Map();
function addCollider(x0,z0,x1,z1,top){
  const c={x0,z0,x1,z1,top};cols.push(c);
  const k=Math.round(((x0+x1)/2)/40)+','+Math.round(((z0+z1)/2)/40);
  let a=grid.get(k);if(!a){a=[];grid.set(k,a);}a.push(c);
}
const tmp=[];
function near(x,z){
  tmp.length=0;const i=Math.round(x/40),j=Math.round(z/40);
  for(let a=i-1;a<=i+1;a++)for(let b=j-1;b<=j+1;b++){
    const arr=grid.get(a+','+b);if(arr)for(let q=0;q<arr.length;q++)tmp.push(arr[q]);
  }
  return tmp;
}
function insideCol(x,y,z){
  const a=near(x,z);
  for(let i=0;i<a.length;i++){const c=a[i];
    if(x>c.x0-0.5&&x<c.x1+0.5&&z>c.z0-0.5&&z<c.z1+0.5&&y<c.top+0.5)return true;}
  return false;
}
function groundH(x,y,z){
  let h=(Math.abs(x)>200||Math.abs(z)>200)?-99:0;
  const a=near(x,z);
  for(let i=0;i<a.length;i++){const c=a[i];
    if(x>c.x0&&x<c.x1&&z>c.z0&&z<c.z1&&c.top<=y+0.6&&c.top>h)h=c.top;}
  return h;
}

const PAL=['#c9ced6','#b7a99a','#9fb3c8','#d9c4a3','#a4abb8','#c7b3ad','#8fa6a2','#b3c0c9','#d2b8a3','#9aa8b8'].map(c=>new THREE.Color(c));
const lots=[];
const brown=new THREE.Color('#6b4a2b'),green=new THREE.Color('#3f7d3a'),green2=new THREE.Color('#4c9143');
for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++){
  const park=rnd()<0.1&&(Math.abs(i)+Math.abs(j))>0;
  lots.push({i,j,park});
  const cx=i*40,cz=j*40;
  if(park){
    for(let k=0;k<6;k++){
      const tx=cx+(rnd()-.5)*22,tz=cz+(rnd()-.5)*22;
      addBox(tx-.4,0,tz-.4,tx+.4,3,tz+.4,brown,true);
      addBox(tx-2,3,tz-2,tx+2,7,tz+2,k%2?green:green2,true);
      addCollider(tx-2,tz-2,tx+2,tz+2,7);
    }
    continue;
  }
  const dd=Math.hypot(i,j);
  const h=14+rnd()*24+Math.max(0,4-dd)*10*rnd();
  const w=18+rnd()*8,d=18+rnd()*8;
  const ox=(rnd()-.5)*(26-w),oz=(rnd()-.5)*(26-d);
  const col=PAL[Math.floor(rnd()*PAL.length)].clone().multiplyScalar(0.85+rnd()*0.2);
  const x0=cx+ox-w/2,x1=cx+ox+w/2,z0=cz+oz-d/2,z1=cz+oz+d/2;
  addBox(x0,0,z0,x1,h,z1,col);addCollider(x0,z0,x1,z1,h);
  if(rnd()<0.55){
    const w2=w*(0.5+rnd()*0.25),d2=d*(0.5+rnd()*0.25),h2=6+rnd()*14;
    const mx=cx+ox,mz=cz+oz;
    addBox(mx-w2/2,h,mz-d2/2,mx+w2/2,h+h2,mz+d2/2,col.clone().multiplyScalar(0.88));
    addCollider(mx-w2/2,mz-d2/2,mx+w2/2,mz+d2/2,h+h2);
  }else if(rnd()<0.4){
    addBox(cx+ox-.3,h,cz+oz-.3,cx+ox+.3,h+7,cz+oz+.3,new THREE.Color('#555a66'),true);
  }
}
function makeWinTex(){
  const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,128,128);
  const cl=['#2b3b55','#31435f','#2b3b55','#ffd98a'];
  for(let a=0;a<2;a++)for(let b=0;b<2;b++){
    const x=a*64+14,y=b*64+12;g.fillStyle=cl[a*2+b];g.fillRect(x,y,38,40);
    g.fillStyle='rgba(255,255,255,.22)';g.fillRect(x,y,38,6);
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
let cityMesh;
{
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(bP,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(bN,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(bUV,2));

function makeGroundTex(){
  const S=1024,k=S/400;const c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
  const X=v=>(v+200)*k;
  g.fillStyle='#7d8593';g.fillRect(0,0,S,S);
  for(const l of lots){
    g.fillStyle=l.park?'#4b7a45':'#9aa1ad';
    g.fillRect(X(l.i*40-15),X(l.j*40-15),30*k,30*k);
  }
  g.fillStyle='#2e323b';
  for(let i=-5;i<=4;i++){const cc=20+40*i;g.fillRect(X(cc-5),0,10*k,S);g.fillRect(0,X(cc-5),S,10*k);}
  g.strokeStyle='#d9c25a';g.lineWidth=0.6*k;g.setLineDash([3*k,3*k]);
  for(let i=-5;i<=4;i++){const cc=X(20+40*i);g.beginPath();g.moveTo(cc,0);g.lineTo(cc,S);g.stroke();g.beginPath();g.moveTo(0,cc);g.lineTo(S,cc);g.stroke();}
  g.setLineDash([]);
  g.fillStyle='#2e323b';
  for(let i=-5;i<=4;i++)for(let j=-5;j<=4;j++)g.fillRect(X(20+40*i-5),X(20+40*j-5),10*k,10*k);
  // harbour plaza
  g.fillStyle='#b4ada0';g.fillRect(0,X(145),S,55*k);
  g.strokeStyle='#a39c8f';g.lineWidth=0.4*k;
  for(let v=-200;v<=200;v+=10){g.beginPath();g.moveTo(X(v),X(145));g.lineTo(X(v),S);g.stroke();}
  for(let v=150;v<=200;v+=10){g.beginPath();g.moveTo(0,X(v));g.lineTo(S,X(v));g.stroke();}
  g.strokeStyle='#d8503c';g.lineWidth=1.2*k;
  g.beginPath();g.arc(X(0),X(168),16*k,0,Math.PI*2);g.stroke();
  g.beginPath();g.arc(X(0),X(168),9*k,0,Math.PI*2);g.stroke();
  g.fillStyle='#e6c229';g.fillRect(0,X(196),S,4*k);
  g.fillStyle='#22252b';for(let v=-200;v<200;v+=8)g.fillRect(X(v),X(196),4*k,4*k);
  const t=new THREE.CanvasTexture(g.canvas);return t;
}

const G=32,RAD=0.85;
function startSwing(wx,wz,mag){
  const p=P.pos,v=P.vel,hs=Math.hypot(v.x,v.z);
  let hx,hz;
  if(mag>0.35){const l=Math.hypot(wx,wz)||1;hx=wx/l;hz=wz/l;}
  else if(hs>4){hx=v.x/hs;hz=v.z/hs;}
  else{hx=Math.sin(yaw);hz=Math.cos(yaw);}
  const ay=Math.min(p.y+40,Math.max(96,p.y+20));
  P.anchor.set(p.x+hx*18,ay,p.z+hz*18);
  P.rope=p.distanceTo(P.anchor);P.ropeT=P.rope*0.85;P.swinging=true;P.swingT=0;
  if(P.grounded){v.y=Math.max(v.y,9);v.x+=hx*5;v.z+=hz*5;p.y+=0.05;P.grounded=false;}
}
function endSwing(){
  if(!P.swinging)return;P.swinging=false;swingWeb.visible=false;
  if(P.vel.y>0)P.vel.y+=4;
}
function collidePlayer(prevY){
  const p=P.pos,v=P.vel,a=near(p.x,p.z);
  for(let i=0;i<a.length;i++){
    const c=a[i];
    if(p.x>c.x0-RAD&&p.x<c.x1+RAD&&p.z>c.z0-RAD&&p.z<c.z1+RAD&&p.y<c.top){
      if(prevY>=c.top-0.4&&v.y<=0.5){p.y=c.top;if(v.y<0)v.y=0;P.grounded=true;continue;}
      const dl=p.x-(c.x0-RAD),dr=(c.x1+RAD)-p.x,df=p.z-(c.z0-RAD),db=(c.z1+RAD)-p.z;
      const m=Math.min(dl,dr,df,db);
      if(m===dl){p.x=c.x0-RAD;if(v.x>0)v.x=0;}
      else if(m===dr){p.x=c.x1+RAD;if(v.x<0)v.x=0;}
      else if(m===df){p.z=c.z0-RAD;if(v.z>0)v.z=0;}
      else{p.z=c.z1+RAD;if(v.z<0)v.z=0;}
    }
  }
}
function damagePlayer(n){
  if(P.invuln>0||state!=='play')return;
  P.hp=Math.max(0,P.hp-n);P.invuln=0.7;P.hurtT=0;
  hurtEl.style.opacity=1;setTimeout(()=>{hurtEl.style.opacity=0;},220);
  if(P.hp<=0)gameOver();
}
function updatePlayer(dt){
  const p=P.pos,v=P.vel;
  let jx=clamp(input.jx+((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0),-1,1);
  let jy=clamp(input.jy+((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0),-1,1);
  let mag=Math.min(1,Math.hypot(jx,jy));if(mag<0.12){mag=0;jx=0;jy=0;}
  const sy=Math.sin(yaw),cy=Math.cos(yaw);
  const wx=sy*jy-cy*jx,wz=cy*jy+sy*jx;
  P.punchT=Math.max(0,P.punchT-dt);P.punchCd=Math.max(0,P.punchCd-dt);P.webCd=Math.max(0,P.webCd-dt);
  P.invuln=Math.max(0,P.invuln-dt);P.hurtT+=dt;P.jumpBuf-=dt;
  const swingHeld=input.swing||keys.KeyE||keys.ShiftLeft||keys.ShiftRight;
  if(!swingHeld)P.needRelease=false;
  if(swingHeld&&!P.swinging&&!P.needRelease)startSwing(wx,wz,mag);
  if(!swingHeld&&P.swinging)endSwing();
  const prevY=p.y;
  if(P.swinging){
    P.swingT+=dt;v.y-=G*dt;
    const hs=Math.hypot(v.x,v.z);
    if(hs>1){
      const ang=-jx*1.6*dt,c=Math.cos(ang),s=Math.sin(ang);
      const nx=v.x*c+v.z*s,nz=v.z*c-v.x*s;v.x=nx;v.z=nz;
      const boost=(v.y<0?16:5)*dt*(0.6+0.4*Math.max(0,jy));
      v.x+=v.x/hs*boost;v.z+=v.z/hs*boost;
      const h2=Math.hypot(v.x,v.z);if(h2>46){v.x*=46/h2;v.z*=46/h2;}
    }
    p.addScaledVector(v,dt);
    P.rope=Math.max(P.ropeT,P.rope-24*dt);
    const dx=p.x-P.anchor.x,dy=p.y-P.anchor.y,dz=p.z-P.anchor.z,len=Math.hypot(dx,dy,dz);
    if(len>P.rope){
      const nx=dx/len,ny=dy/len,nz=dz/len;
      p.set(P.anchor.x+nx*P.rope,P.anchor.y+ny*P.rope,P.anchor.z+nz*P.rope);
      const vr=v.x*nx+v.y*ny+v.z*nz;
      if(vr>0){v.x-=nx*vr;v.y-=ny*vr;v.z-=nz*vr;}
    }
    v.multiplyScalar(1-0.06*dt);
  }else{
    v.y-=G*dt;
    if(P.grounded){
      const k=1-Math.exp(-14*dt);
      v.x+=(wx*mag*11-v.x)*k;v.z+=(wz*mag*11-v.z)*k;
    }else if(mag>0){
      const before=Math.hypot(v.x,v.z);
      v.x+=wx*mag*20*dt;v.z+=wz*mag*20*dt;
      const after=Math.hypot(v.x,v.z),cap=Math.max(before,12);
      if(after>cap){v.x*=cap/after;v.z*=cap/after;}
    }
    if(P.jumpBuf>0&&P.grounded){v.y=15.5;P.grounded=false;P.jumpBuf=0;p.y+=0.05;}
    p.addScaledVector(v,dt);
  }
  p.x=clamp(p.x,-300,300);p.z=clamp(p.z,-300,300);
  P.grounded=false;
  collidePlayer(prevY);
  if(p.y<=0&&Math.abs(p.x)<=200&&Math.abs(p.z)<=200){p.y=0;if(v.y<0)v.y=0;P.grounded=true;}
  if(P.swinging&&P.grounded&&P.swingT>0.6){endSwing();P.needRelease=true;}
  if(P.grounded&&Math.abs(p.x)<185&&Math.abs(p.z)<185)lastSafe.copy(p);
  if(p.y<-3){
    emit(p.x,-1.5,p.z,30,.6,.8,1,9,.9);endSwing();
    p.copy(lastSafe);v.set(0,0,0);toast('Splash! Back on land.',1600);
  }
  if(P.hp<100&&P.hurtT>5)P.hp=Math.min(100,P.hp+4*dt);
  const hs=Math.hypot(v.x,v.z);
  if(P.punchT<=0&&hs>1.5)P.face=angLerp(P.face,Math.atan2(v.x,v.z),1-Math.exp(-14*dt));
  const mode=P.swinging?'swing':(!P.grounded?'air':(hs>1?'run':'idle'));
  animHuman(hero,time,mode,Math.min(20,6+hs*0.9),P.punchT);
  hero.g.position.copy(p);hero.g.rotation.y=P.face;
  if(P.swinging)setWeb(swingWeb,p.x,p.y+1.9,p.z,P.anchor.x,P.anchor.y,P.anchor.z);
  const gh=groundH(p.x,p.y,p.z);
  if(gh>-50){heroShadow.visible=true;heroShadow.position.set(p.x,gh+0.06,p.z);const sc=clamp(1.2-(p.y-gh)*0.012,0.4,1.2);heroShadow.scale.set(sc,1,sc);}
  else heroShadow.visible=false;
}

  let nx,nz,tries=0;
  do{nx=NODES[Math.floor(Math.random()*8)];nz=NODES[Math.floor(Math.random()*8)];tries++;}
  while(Math.hypot(nx-P.pos.x,nz-P.pos.z)<70&&tries<20);
  const h=humanoid({top:'#2b2e38',arms:'#2b2e38',legs:'#454a58',head:'#e2b48c',extra:mk=>{
    mk(BOX,'#0d0d10',0.7,0.2,0.7,0,2.36,0);
    mk(BOX,'#d4a017',0.62,0.78,0.36,0,1.5,-0.46);
  }});
  h.g.scale.setScalar(1.25);
  const marker=new THREE.Mesh(CONE,markMat);marker.position.y=3.6;marker.renderOrder=10;h.g.add(marker);
  const wrap=new THREE.Mesh(SPH,M('#f4f6fb'));wrap.scale.set(1.6,3,1.6);wrap.position.y=1.35;wrap.visible=false;h.g.add(wrap);
  const t={g:h.g,h,pos:new THREE.Vector3(nx,0,nz),at:{x:nx,z:nz},prev:null,to:null,state:'run',hp:2,stun:0,t:0,marker,wrap,face:0,pu:0,sx:0,sz:0,ph:Math.random()*6};
  t.to=chooseNext(t);
  h.g.position.copy(t.pos);scene.add(h.g);thieves.push(t);
}
function clearThieves(){for(const t of thieves)scene.remove(t.g);thieves.length=0;}
function catchThief(t){
  t.state='caught';t.t=2.2;caught++;t.marker.visible=false;t.wrap.visible=true;t.h.body.children.forEach(c=>{if(c!==t.wrap)c.visible=false;});
  t.pos.y=0;
  emit(t.pos.x,1.2,t.pos.z,16,1,1,1,6,0.6);
  if(caught>=NEED){toast('All thieves webbed! Something is rumbling at the harbour...',3200);advanceIn(3.2,startSandman);}
  else toast('Thief webbed! '+caught+' / '+NEED);
}
function updateThieves(dt){
  for(let i=thieves.length-1;i>=0;i--){
    const t=thieves[i];t.ph+=dt;
    if(t.state==='run'){
      if(t.stun>0){t.stun-=dt;animHuman(t.h,t.ph,'idle',0,0);}
      else{
        const dx=t.to.x-t.pos.x,dz=t.to.z-t.pos.z,d=Math.hypot(dx,dz);
        const nearP=Math.hypot(t.pos.x-P.pos.x,t.pos.z-P.pos.z)<40;
        const step=(nearP?12:9)*dt;
        if(d<=step){t.pos.x=t.to.x;t.pos.z=t.to.z;t.prev=t.at;t.at=t.to;t.to=chooseNext(t);}
        else{t.pos.x+=dx/d*step;t.pos.z+=dz/d*step;t.face=Math.atan2(dx,dz);}
        animHuman(t.h,t.ph,'run',nearP?16:12,0);
      }
      t.marker.position.y=3.6+Math.sin(t.ph*4)*0.25;
    }else if(t.state==='pulled'){
      t.pu+=dt/0.32;const u=Math.min(1,t.pu);
      t.pos.x=t.sx+(P.pos.x-t.sx)*u;t.pos.z=t.sz+(P.pos.z-t.sz)*u;t.pos.y=Math.sin(Math.PI*u)*4;
      animHuman(t.h,t.ph,'air',0,0);
      if(u>=1)catchThief(t);
    }else if(t.state==='caught'){
      t.t-=dt;t.wrap.scale.set(1.6+Math.sin(t.ph*10)*0.05,3,1.6);
      if(t.t<=0){emit(t.pos.x,1.5,t.pos.z,10,1,1,1,4,0.5);scene.remove(t.g);thieves.splice(i,1);continue;}
    }
    t.g.position.copy(t.pos);t.g.rotation.y=t.face;
  }
  if(stageIdx===0&&caught<NEED){
    let alive=0;for(const t of thieves)if(t.state==='run'||t.state==='pulled')alive++;
    spawnT-=dt;
    if(alive<Math.min(4,NEED-caught)&&spawnT<=0){spawnThief();spawnT=1.5;}
  }
}
function startThieves(){
  stageIdx=0;setStageLabel();caught=0;spawnT=0;clearThieves();
  for(let i=0;i<4;i++)spawnThief();
  toast('Catch 5 thieves! Tap WEB to snag one, or swing in and PUNCH.',3200);
}

/* ================== GENERIC BOSS ENGINE ==================
   One state machine reused for every melee boss: chase -> windup -> slam(aoe) / throw(projectile) -> stun.
   Differences between bosses are just stats + color + a couple of behaviour flags, so 10+ villains
   share one code path instead of 10+ bespoke ones (keeps the file small & the frame rate steady). */
const blasts=[];const blastGeo=new THREE.SphereGeometry(1,8,6);
function fireBlastFrom(bx,by,bz,col,speed){
  const m=new THREE.Mesh(blastGeo,M(col));m.scale.setScalar(1.1);
  m.position.set(bx,by,bz);scene.add(m);
  const tx=P.pos.x-bx,ty=P.pos.y+1.2-by,tz=P.pos.z-bz,l=Math.hypot(tx,ty,tz)||1;
  blasts.push({m,vx:tx/l*speed,vy:ty/l*speed,vz:tz/l*speed,life:4,dmg:12});
}
function updateBlasts(dt){
  for(let i=blasts.length-1;i>=0;i--){
    const b=blasts[i];b.life-=dt;
    b.m.position.x+=b.vx*dt;b.m.position.y+=b.vy*dt;b.m.position.z+=b.vz*dt;
    const d=dist3(b.m.position.x,b.m.position.y,b.m.position.z,P.pos.x,P.pos.y+1.2,P.pos.z);
    let dead=false;
    if(d<2.4){damagePlayer(b.dmg);P.vel.x+=b.vx*0.15;P.vel.z+=b.vz*0.15;dead=true;emit(b.m.position.x,b.m.position.y,b.m.position.z,10,.85,.7,.4,6,.5);}
    else if(b.life<=0||b.m.position.y<0)dead=true;
    if(dead){scene.remove(b.m);blasts.splice(i,1);}
  }
}
function clearBlasts(){for(const b of blasts)scene.remove(b.m);blasts.length=0;}

const ring=new THREE.Mesh(new THREE.RingGeometry(0.9,1,40).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({color:0xe7c37a,transparent:true,opacity:0.65,side:THREE.DoubleSide,depthWrite:false}));
ring.visible=false;scene.add(ring);

// Pool of boss instances so we don't rebuild geometry per villain; bossDefs describes each.
function makeBossModel(def){
  const h=humanoid(def.look);
  if(def.chunks){
    const arr=[];
    for(let k=0;k<8;k++){const m=new THREE.Mesh(BOX,M(def.chunkCol||def.look.top));m.scale.setScalar(0.3+Math.random()*0.25);h.g.add(m);arr.push(m);}
    h.chunks=arr;
  }
  h.g.visible=false;scene.add(h.g);
  h.shadow=makeBigShadow();
  return h;
}

let BOSS=null,bossDef=null,bossDeadCb=null;
const bossTintNames={};
function bossTargetable(){return BOSS&&(BOSS.state==='spawn'||BOSS.state==='chase'||BOSS.state==='windup'||BOSS.state==='slam'||BOSS.state==='throw'||BOSS.state==='stun');}

function spawnBoss(def,onDead){
  bossDef=def;bossDeadCb=onDead;
  if(!def.model)def.model=makeBossModel(def);
  BOSS={
    def,hum:def.model,pos:new THREE.Vector3(def.spawn.x,0,def.spawn.z),vy:0,kx:0,kz:0,
    state:'spawn',t:1.5,cd:def.meleeCd0!=null?def.meleeCd0:2,bcd:def.rangedCd0!=null?def.rangedCd0:3,
    face:Math.PI,slamHit:false,ph:0,hp:def.hp,hpMax:def.hp,phase2:false
  };
  def.model.g.visible=true;def.model.shadow.visible=true;
  def.model.g.position.copy(BOSS.pos);
  bossw.style.display='block';bossnEl.textContent=def.name;bossbEl.style.width='100%';
  emit(BOSS.pos.x,3,BOSS.pos.z,40,def.tint[0],def.tint[1],def.tint[2],10,1);
  if(def.introToast)toast(def.introToast,3600);
  if(def.introBanner)banner(def.introBanner,def.introSub||'',2600);
}
function despawnBoss(){
  if(!BOSS)return;
  BOSS.def.model.g.visible=false;BOSS.def.model.shadow.visible=false;
  bossw.style.display='none';
  BOSS=null;
}
function damageBoss(n){
  if(!BOSS||!bossDef.vulnerable)return;
  BOSS.hp=Math.max(0,BOSS.hp-n);
  bossbEl.style.width=Math.max(0,BOSS.hp/BOSS.hpMax*100)+'%';
  if(BOSS.hp<=0&&BOSS.state!=='dying'){
    BOSS.state='dying';BOSS.t=1.1;
    emit(BOSS.pos.x,3,BOSS.pos.z,50,bossDef.tint[0],bossDef.tint[1],bossDef.tint[2],11,1);
  }
}
function updateBoss(dt){
  if(!BOSS)return;
  const s=BOSS,def=bossDef,p=P.pos;
  s.t-=dt;s.ph+=dt;
  let mode='idle',spd=0;
  if(s.state==='dying'){
    animHuman(s.hum,s.ph,'air',0,0);
    s.hum.g.scale.setScalar(def.scale*(1+ (1.1-Math.max(0,s.t))*0.4));
    if(s.t<=0){finishBossDeath();}
    s.hum.g.position.copy(s.pos);s.hum.g.rotation.y=s.face;
    return;
  }
  if(def.sinks&&s.state==='sink'){
    s.pos.y-=3*dt;
    if(s.t<=0){s.state='dead';finishBossDeath();}
    s.hum.g.position.copy(s.pos);s.hum.g.scale.set(def.scale*2.6,def.scale*2.6*clamp(s.t/1.2,0.02,1),def.scale*2.6);
    return;
  }
  // physics (gravity + knockback drag), shared by all
  s.vy-=30*dt;s.pos.y+=s.vy*dt;s.pos.x+=s.kx*dt;s.pos.z+=s.kz*dt;
  const hasGround=Math.abs(s.pos.x)<=200&&s.pos.z<=200;
  const onG=hasGround&&s.pos.y<=0;
  if(onG){s.pos.y=0;if(s.vy<0)s.vy=0;}
  const drag=Math.exp((onG?-2.2:-0.35)*dt);s.kx*=drag;s.kz*=drag;
  if(hasGround){s.pos.x=clamp(s.pos.x,-190,190);
    if(def.confineZ!=null&&s.pos.z<def.confineZ){s.pos.z=def.confineZ;if(s.kz<0)s.kz=0;}
  }else if(def.sinks&&s.state!=='fall'){s.state='fall';}
  if(def.sinks&&s.state==='fall'){
    mode='air';
    if(s.pos.y<-3){s.state='sink';s.t=1.2;emit(s.pos.x,-1.5,s.pos.z,50,.55,.75,1,11,1.0);toast(def.sinkToast||'Splash!',2600);}
  }
  switch(s.state){
    case 'spawn':
      if(s.t<=0){s.state='chase';s.cd=def.meleeCd0!=null?def.meleeCd0:2;s.bcd=def.rangedCd0!=null?def.rangedCd0:3;}
      break;
    case 'chase':{
      const dx=p.x-s.pos.x,dz=p.z-s.pos.z,d=Math.hypot(dx,dz);
      if(d>0.1)s.face=angLerp(s.face,Math.atan2(dx,dz),1-Math.exp(-6*dt));
      if(d<140){
        if(d>def.meleeRange+2){const spdV=def.chaseSpeed;s.pos.x+=dx/d*spdV*dt;s.pos.z+=dz/d*spdV*dt;mode='run';spd=4;}
        s.cd-=dt;s.bcd-=dt;
        if(d<def.meleeRange&&s.cd<=0){s.state='windup';s.t=def.windupT;}
        else if(def.ranged&&d>def.meleeRange+2&&s.bcd<=0){s.state='throw';s.t=0.55;}
      }
    }break;
    case 'windup':mode='up';if(s.t<=0){s.state='slam';s.t=0.4;s.slamHit=false;}break;
    case 'slam':{
      mode='slam';const u=1-s.t/0.4,r=u*def.slamRadius;
      ring.position.set(s.pos.x,0.25,s.pos.z);ring.scale.set(r+0.1,1,r+0.1);
      ring.material.color.setRGB(def.tint[0],def.tint[1],def.tint[2]);
      if(!s.slamHit&&p.y<3.2){
        const d=Math.hypot(p.x-s.pos.x,p.z-s.pos.z);
        if(Math.abs(d-r)<3.2){damagePlayer(def.slamDmg);s.slamHit=true;const l=d||1;P.vel.x+=(p.x-s.pos.x)/l*12;P.vel.z+=(p.z-s.pos.z)/l*12;P.vel.y=8;P.grounded=false;}
      }
      if(s.t<=0){s.state='chase';s.cd=def.meleeCd;}
    }break;
    case 'throw':mode='throw';if(s.t<=0){fireBlastFrom(s.pos.x,s.pos.y+def.scale*2.3,s.pos.z,def.projCol||'#d9b46a',def.projSpeed||26);s.bcd=def.rangedCd;s.state='chase';}break;
    case 'stun':mode='air';if(s.t<=0&&s.vy===0)s.state='chase';else if(s.t<=-1.5)s.state='chase';break;
  }
  ring.visible=(s.state==='slam');
  activateVillainPower();
  s.hum.g.position.copy(s.pos);s.hum.g.rotation.y=s.face;
  let sc=1;
  if(s.state==='spawn')sc=0.05+0.95*(1-clamp(s.t/1.5,0,1));
  s.hum.g.scale.setScalar(def.scale*sc);
  animHuman(s.hum,s.ph,mode,spd,0);
  if(s.hum.chunks)for(let k=0;k<s.hum.chunks.length;k++){
    const a=s.ph*1.4+k*0.785;
    s.hum.chunks[k].position.set(Math.cos(a)*1.4,1.1+(k%4)*0.5+Math.sin(s.ph*2+k)*0.15,Math.sin(a)*1.4);
    s.hum.chunks[k].rotation.y=a;
  }
  const gh=(Math.abs(s.pos.x)<=200&&s.pos.z<=200&&s.state!=='sink')?0:-99;
  s.hum.shadow.visible=gh>-50;s.hum.shadow.position.set(s.pos.x,0.07,s.pos.z);
}
function finishBossDeath(){
  const def=bossDef,cb=bossDeadCb;
  emit(BOSS.pos.x,2,BOSS.pos.z,30,def.tint[0],def.tint[1],def.tint[2],9,0.9);
  despawnBoss();
  if(cb)cb();
}
function knockBoss(mult,dmg){
  if(!BOSS)return;
  const dx=BOSS.pos.x-P.pos.x,dz=BOSS.pos.z-P.pos.z,l=Math.hypot(dx,dz)||1;
  BOSS.kx=dx/l*24*mult;BOSS.kz=dz/l*24*mult;BOSS.vy=4*mult;BOSS.state='stun';BOSS.t=0.7;
  emit(BOSS.pos.x,3,BOSS.pos.z,14,bossDef.tint[0],bossDef.tint[1],bossDef.tint[2],7,.5);
  if(dmg)damageBoss(dmg);
}
function flingBoss(){
  if(!bossTargetable())return;
  let dx=Math.sin(yaw)*0.45,dz=Math.cos(yaw)*0.45+0.55;
  const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;
  BOSS.kx=dx*42;BOSS.kz=dz*42;BOSS.vy=9;BOSS.state='stun';BOSS.t=1.0;
  emit(BOSS.pos.x,3,BOSS.pos.z,24,bossDef.tint[0],bossDef.tint[1],bossDef.tint[2],9,.7);
  if(bossDef.vulnerable)damageBoss(bossDef.webDmg||18);
}

/* ================== 20 NINJAS (stage 6) ================== */
const NINJA_N=20;
const ninjas=[];
const starGeo=new THREE.OctahedronGeometry(0.35,0);
const starMat=new THREE.MeshBasicMaterial({color:0x111318});
const ninjaStars=[];
function ninjaModel(){
  const h=humanoid({top:'#1c1e26',arms:'#1c1e26',legs:'#14151b',head:'#241f2c',extra:mk=>{
    mk(BOX,'#0c0c10',0.72,0.3,0.72,0,2.4,0);mk(BOX,'#c22',0.72,0.08,0.05,0,2.44,0.36);
  }});
  h.g.scale.setScalar(1.15);scene.add(h.g);
  return h;
}
function spawnNinjaWave(){
  const cnt=Math.min(NINJA_N,20);
  for(let i=0;i<cnt;i++){
    const a=(i/cnt)*Math.PI*2,r=55+Math.random()*20;
    const x=clamp(P.pos.x+Math.sin(a)*r,-170,170),z=clamp(110+Math.cos(a)*r*0.6,10,190);
    const h=ninjaModel();h.g.position.set(x,0,z);
    ninjas.push({g:h.g,h,pos:new THREE.Vector3(x,0,z),state:'run',hp:1,stun:0,face:0,ph:Math.random()*6,throwCd:1+Math.random()*2.4,t:0});
  }
  setObj('Ninjas: 0 / '+ninjaTotal+' defeated');
}
function clearNinjas(){for(const n of ninjas)scene.remove(n.g);ninjas.length=0;for(const s of ninjaStars)scene.remove(s.m);ninjaStars.length=0;}
let ninjasDown=0,ninjaTotal=0;
function throwStar(n){
  const m=new THREE.Mesh(starGeo,starMat);m.position.set(n.pos.x,1.6,n.pos.z);scene.add(m);
  const tx=P.pos.x-n.pos.x,tz=P.pos.z-n.pos.z,l=Math.hypot(tx,tz)||1;
  ninjaStars.push({m,vx:tx/l*22,vz:tz/l*22,life:2.4});
}
function updateNinjaStars(dt){
  for(let i=ninjaStars.length-1;i>=0;i--){
    const s=ninjaStars[i];s.life-=dt;
    s.m.position.x+=s.vx*dt;s.m.position.z+=s.vz*dt;s.m.rotation.y+=dt*20;
    const d=Math.hypot(s.m.position.x-P.pos.x,s.m.position.z-P.pos.z);
    let dead=false;
    if(d<1.6&&Math.abs(s.m.position.y-(P.pos.y+1.2))<2.2){damagePlayer(8);dead=true;}
    else if(s.life<=0)dead=true;
    if(dead){scene.remove(s.m);ninjaStars.splice(i,1);}
  }
}
function updateNinjas(dt){
  for(let i=ninjas.length-1;i>=0;i--){
    const n=ninjas[i];n.ph+=dt;
    if(n.state==='run'){
      if(n.stun>0){n.stun-=dt;animHuman(n.h,n.ph,'idle',0,0);}
      else{
        const dx=P.pos.x-n.pos.x,dz=P.pos.z-n.pos.z,d=Math.hypot(dx,dz);
        n.face=angLerp(n.face,Math.atan2(dx,dz),1-Math.exp(-5*dt));
        if(d>16){const step=7*dt;n.pos.x+=dx/d*step;n.pos.z+=dz/d*step;animHuman(n.h,n.ph,'run',12,0);}
        else animHuman(n.h,n.ph,'idle',0,0);
        n.throwCd-=dt;
        if(n.throwCd<=0&&d<40){throwStar(n);n.throwCd=1.8+Math.random()*1.4;}
      }
    }else if(n.state==='down'){
      n.t-=dt;
      if(n.t<=0){scene.remove(n.g);ninjas.splice(i,1);continue;}
    }
    n.g.position.copy(n.pos);n.g.rotation.y=n.face;
  }
  updateNinjaStars(dt);
  if(stageIdx===6&&ninjas.length===0&&ninjasDown>=ninjaTotal&&ninjaTotal>0){
    stageIdx=6.5;
    advanceIn(1.2,startGauntlet);
    toast('The rooftop ninjas are cleared! The Rogues Gallery awaits...',3000);
  }
}
function hitNinja(n){
  n.state='down';n.t=1.4;n.stun=99;ninjasDown++;
  emit(n.pos.x,1.4,n.pos.z,12,.15,.15,.2,6,.5);
  setObj('Ninjas: '+ninjasDown+' / '+ninjaTotal+' defeated');
}

  stageIdx=6;setStageLabel();clearNinjas();ninjasDown=0;ninjaTotal=NINJA_N;

  banner('20 NINJAS','Rooftop ambush',2200);

}

function updateVenomCar(dt){
  if(!venomCar.burning)return;
  venomCar.burnT+=dt;
  const flick=0.5+Math.sin(venomCar.burnT*30)*0.5;
  if(Math.random()<0.6)emit(venomCar.g.position.x+(Math.random()-0.5)*2,1.2+Math.random(),venomCar.g.position.z+(Math.random()-0.5)*2,3,1,.4+flick*.3,.05,3,.5);
  if(Math.random()<0.15)emit(venomCar.g.position.x,1.6,venomCar.g.position.z,2,.15,.15,.15,1.5,1.1);
}
function tryCarTakedown(){
  // Called on PUNCH when Venom is weak & near the finale car: punches him toward it and webs him in.
  if(!BOSS||bossDef!==venomDef||venomPhase!=='solo')return false;
  const lowHp=BOSS.hp<=venomDef.hp*0.35;
  const carDist=Math.hypot(BOSS.pos.x-venomCar.x,BOSS.pos.z-venomCar.z);
  if(!venomCar.burning&&carDist<70){
    igniteVenomCar();
    toast('Web-yank a nearby pump line and PUNCH Venom toward the burning car!',3400);
  }
  if(lowHp&&venomCar.burning&&carDist<9){
    venomPhase='finish';
    finishVenom();
    return true;
  }

let shot=null,shownPunchHint=false;
function doPunch(){
  if(state!=='play'||P.punchCd>0)return;
  P.punchCd=0.34;P.punchT=0.22;
  const p=P.pos;
  let best=null,bd=6.5;
  for(const t of thieves){
    if(t.state!=='run')continue;
    const d=dist3(p.x,p.y+1.3,p.z,t.pos.x,t.pos.y+1.3,t.pos.z);
    if(d<bd){bd=d;best=t;}
  }
  if(best){
    P.face=Math.atan2(best.pos.x-p.x,best.pos.z-p.z);
    best.hp--;best.stun=0.4;
    emit(best.pos.x,1.6,best.pos.z,8,1,.9,.5,5,.4);
    if(best.hp<=0)catchThief(best);
    return;
  }
  let bestN=null,bdN=6.5;
  for(const n of ninjas){
    if(n.state!=='run')continue;
    const d=dist3(p.x,p.y+1.3,p.z,n.pos.x,n.pos.y+1.3,n.pos.z);
    if(d<bdN){bdN=d;bestN=n;}
  }
  if(bestN){P.face=Math.atan2(bestN.pos.x-p.x,bestN.pos.z-p.z);hitNinja(bestN);return;}
  // Mysterio illusion decoys: punchable but harmless
  if(BOSS&&bossDef===mysterioDef){
    for(const dcy of mysDecoys){
      const d=dist3(p.x,p.y+1.3,p.z,dcy.g.position.x,dcy.g.position.y+1.3,dcy.g.position.z);
      if(d<6.5){P.face=Math.atan2(dcy.g.position.x-p.x,dcy.g.position.z-p.z);punchDecoy();return;}
    }
  }
  if(BOSS&&bossTargetable()){
    const d=dist3(p.x,p.y+1.3,p.z,BOSS.pos.x,BOSS.pos.y+bossDef.scale*1.3,BOSS.pos.z);
    if(d<11){
      const dx=BOSS.pos.x-p.x,dz=BOSS.pos.z-p.z,l=Math.hypot(dx,dz)||1;
      P.face=Math.atan2(dx,dz);
      if(bossDef===venomDef){
        knockBoss(1,14);
        if(tryCarTakedown())return;
      }else if(bossDef.vulnerable){
        knockBoss(1,16);
      }else{
        knockBoss(1,0);
        if(!shownPunchHint){shownPunchHint=true;toast('Punches only shove him. Use WEB to fling him into the sea!',3200);}
      }
    }
  }
}
function useWeb(){
  if(state!=='play'||shot)return;
  if(P.webCd>0)return;
  const p=P.pos;let best=null,bd=999;
  if(stageIdx===0){
    for(const t of thieves){
      if(t.state!=='run')continue;
      const d=dist3(p.x,p.y+1.5,p.z,t.pos.x,t.pos.y+1.3,t.pos.z);
      if(d<bd&&d<45){bd=d;best=t;}
    }
    if(best){best.state='pulled';best.pu=0;best.sx=best.pos.x;best.sz=best.pos.z;shot={kind:'thief',obj:best};P.webCd=1.0;}
  }else if(stageIdx===6){
    for(const n of ninjas){
      if(n.state!=='run')continue;
      const d=dist3(p.x,p.y+1.5,p.z,n.pos.x,n.pos.y+1.3,n.pos.z);
      if(d<bd&&d<40){bd=d;best=n;}
    }
    if(best){hitNinja(best);P.webCd=0.6;toast('Ninja webbed up!',900);return;}
  }else if(BOSS&&bossTargetable()){
    const d=dist3(p.x,p.y+1.5,p.z,BOSS.pos.x,BOSS.pos.y+bossDef.scale*1.3,BOSS.pos.z);
    if(d<60){shot={kind:'boss',t:0.25};P.webCd=1.6;}

}
function updateShot(dt){
  if(!shot){if(!(BOSS&&bossDef===venomDef&&venomPhase==='finish'))shotWeb.visible=false;return;}
  const p=P.pos;

    if(shot.obj.state!=='pulled'){shot=null;shotWeb.visible=false;return;}
    const t=shot.obj;setWeb(shotWeb,p.x,p.y+1.9,p.z,t.pos.x,t.pos.y+1.3,t.pos.z);
  }else{
    shot.t-=dt;setWeb(shotWeb,p.x,p.y+1.9,p.z,BOSS.pos.x,BOSS.pos.y+bossDef.scale*1.3,BOSS.pos.z);
    if(shot.t<=0){
      if(bossDef===venomDef){
        // Venom can't be flung into the sea \u2014 web-yank pulls him toward the car instead.
        if(venomCar.burning){
          const dx=venomCar.g.position.x-BOSS.pos.x,dz=venomCar.g.position.z-BOSS.pos.z,l=Math.hypot(dx,dz)||1;
          BOSS.kx=dx/l*20;BOSS.kz=dz/l*20;BOSS.vy=3;BOSS.state='stun';BOSS.t=0.8;

        }

    }
  }
}

/* ---------- camera ---------- */
function updateCamera(dt){
  if(state==='title'){
    const a=now*0.00012;
    camera.position.set(Math.sin(a)*150,70,Math.cos(a)*150);camera.lookAt(0,15,0);return;
  }
  const p=P.pos,v=P.vel,hs=Math.hypot(v.x,v.z);
  if((P.swinging||(!P.grounded&&hs>12))&&now-lastDrag>1400&&hs>4)yaw=angLerp(yaw,Math.atan2(v.x,v.z),1-Math.exp(-2.4*dt));
  const spd=Math.hypot(v.x,v.y,v.z);
  const dist=9+clamp(spd*0.1,0,4);
  const tx=p.x,ty=p.y+2.4,tz=p.z;
  const cp=Math.cos(pitch),sp=Math.sin(pitch);
  let cx=tx-Math.sin(yaw)*cp*dist,cy=Math.max(ty+sp*dist,1),cz=tz-Math.cos(yaw)*cp*dist;
  for(let s=1;s>0.2;s-=0.12){
    const x=tx+(cx-tx)*s,y=ty+(cy-ty)*s,z=tz+(cz-tz)*s;
    if(!insideCol(x,y,z)){cx=x;cy=y;cz=z;break;}
  }
  if(snapCam){camera.position.set(cx,cy,cz);snapCam=false;}
  else{
    const k=1-Math.exp(-16*dt);
    camera.position.x+=(cx-camera.position.x)*k;camera.position.y+=(cy-camera.position.y)*k;camera.position.z+=(cz-camera.position.z)*k;
  }
  camera.lookAt(tx,ty,tz);
  const fov=65+clamp(hs-14,0,26)*0.35;
  if(Math.abs(fov-camera.fov)>0.05){camera.fov+=(fov-camera.fov)*(1-Math.exp(-4*dt));camera.updateProjectionMatrix();}
}

/* ---------- main loop + adaptive resolution ---------- */
let accT=0,accF=0,hiCount=0,last=0,lastResize=0;
function adapt(raw){
  accT+=raw;accF++;
  if(accT>=1){
    const fps=accF/accT;accT=0;accF=0;
    const now=Date.now();
    if(now-lastResize<500)return; // Debounce: wait at least 500ms between resizes
    if(fps<38&&ratio>0.5){ratio=Math.max(0.5,ratio-0.125);hiCount=0;resize();lastResize=now;}
    else if(fps>57&&ratio<maxRatio){hiCount++;if(hiCount>=4){ratio=Math.min(maxRatio,ratio+0.125);hiCount=0;resize();lastResize=now;}}
    else hiCount=0;
  }
}
function frame(ts){
  requestAnimationFrame(frame);
  now=ts;const raw=last?(ts-last)/1000:0.016;last=ts;
  if(raw>1)return;
  const dt=Math.min(raw,0.05);
  time+=dt;
  try{
    if(state==='play'||state==='cutscene'){
      if(state==='play'){updatePlayer(dt);}
      updateThieves(dt);updateNinjas(dt);updateShot(dt);updateBoss(dt);updateBlasts(dt);updateMysterioDecoys(dt);
      updateAllies(dt);updateVenomAllies(dt);updateVenomCar(dt);
      if(advTimer>0){advTimer-=dt;if(advTimer<=0&&advCb){const cb=advCb;advCb=null;cb();}}
      if(state==='play')updateHud(dt);
    }else if(state==='title'){
      animHuman(hero,time,'idle',0,0);hero.g.position.copy(P.pos);
    }
    updateParticles(dt);
    if(storm.on)updateRain(dt,P.pos.x,P.pos.z);
    waterTex.offset.x+=dt*0.012;waterTex.offset.y+=dt*0.007;
    updateCamera(dt);
    if(renderer&&renderer.render){
      renderer.render(scene,camera);
    }
  }catch(e){
    console.error('Frame error:',e.message);
  }
  adapt(raw);
}

 }else{

  V.near=n;$('v5Interact').style.display=n?'block':'none';if(n)$('v5Interact').innerHTML='Press <b>E</b> to enter '+(n.bike?'MOTORCYCLE 🏍️':'CAR 🚗');
 }
}
